# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# This repository is a fork: Dependabot version updates run only after you enable
# them in Settings > Code security > Dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # uv updates pyproject.toml and uv.lock together; pip would leave uv.lock behind
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The minimum Home Assistant must match the homeassistant key of hacs.json
      - dependency-name: homeassistant
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
