name: Checks

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
    paths-ignore:
      - '**.md'
      - '**.png'

  pull_request:


jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Pre-commit on all files
        run: uv run pre-commit run --all-files
