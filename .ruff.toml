# https://github.com/ludeeus/integration_blueprint/blob/main/.ruff.toml
# ---------------------------------------------------------------------
# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "CPY001", # copyright notice in each file: Home Assistant core does not check it, LICENSE covers the repository
]

[lint.per-file-ignores]
# The rules that a test has no reason to follow
"tests/**" = [
    "S101",    # pytest checks each result with assert, and nobody runs the tests with python -O
    "S105",    # the tests use made-up passwords
    "S106",    # the tests use made-up passwords
    "SLF001",  # a test reads the private state to check what the code keeps
    "PLR2004", # the expected value in an assert is the test itself
    "ANN001",  # ty checks only custom_components ([tool.ty.src] in pyproject.toml), so no tool reads these annotations
    "ANN003",  # the same as ANN001
    "ANN201",  # the same as ANN001
    "ANN202",  # the same as ANN001
    "PLR0913", # pytest gives the arguments of a test from its fixtures and parameters, and no code calls a test
    "PLR0917", # the same as PLR0913
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
